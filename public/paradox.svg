<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 708 96" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision">
  <title id="title">Continuously animated ParadoxNetworks header logo</title>
  <desc id="desc">The outlined wordmark remains still while the carrier lanes move in a continuous travelling wave.</desc>
  <style>
    .lane { animation: lane-signal 3.8s ease-in-out infinite; animation-delay: calc(var(--i) * -170ms); transform-box: fill-box; transform-origin: center; }
    @keyframes lane-signal { 0%,100% { transform:translateY(-2.5px) scaleY(.88); } 50% { transform:translateY(2.5px) scaleY(1.12); } }
    @media (prefers-reduced-motion: reduce) { .lane { animation:none; transform:none; } }
  </style>
